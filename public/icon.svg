<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="512" height="512" rx="108" fill="url(#shine)"/>
  <!-- Code brackets -->
  <text x="88" y="340" font-family="Consolas, 'Courier New', monospace" font-size="220" font-weight="bold" fill="rgba(255,255,255,0.2)">&lt;</text>
  <text x="340" y="340" font-family="Consolas, 'Courier New', monospace" font-size="220" font-weight="bold" fill="rgba(255,255,255,0.2)">&gt;</text>
  <!-- Central C letter -->
  <text x="256" y="330" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="240" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="central" letter-spacing="-8">C</text>
  <!-- Subtle cursor line -->
  <rect x="300" y="180" width="4" height="100" rx="2" fill="rgba(255,255,255,0.6)"/>
  <!-- Bottom accent dots -->
  <circle cx="220" cy="420" r="6" fill="rgba(255,255,255,0.4)"/>
  <circle cx="256" cy="420" r="6" fill="rgba(255,255,255,0.6)"/>
  <circle cx="292" cy="420" r="6" fill="rgba(255,255,255,0.4)"/>
</svg>
