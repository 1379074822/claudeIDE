<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="capyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c2854a"/>
      <stop offset="100%" style="stop-color:#8b5e3c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Top bar / title bar decoration -->
  <rect x="0" y="0" width="512" height="40" rx="0" fill="rgba(255,255,255,0.04)"/>
  <rect x="0" y="0" width="512" height="40" rx="96 96 0 0" fill="rgba(255,255,255,0.04)"/>
  <!-- Window dots -->
  <circle cx="52" cy="20" r="7" fill="#ff5f57"/>
  <circle cx="80" cy="20" r="7" fill="#febc2e"/>
  <circle cx="108" cy="20" r="7" fill="#28c840"/>

  <!-- Code lines background decoration -->
  <rect x="44" y="64" width="180" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="44" y="84" width="140" height="8" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="44" y="104" width="200" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="44" y="124" width="120" height="8" rx="4" fill="rgba(255,255,255,0.05)"/>

  <!-- Capybara body (main) -->
  <ellipse cx="256" cy="320" rx="130" ry="90" fill="url(#capyGrad)"/>

  <!-- Capybara head -->
  <ellipse cx="256" cy="235" rx="85" ry="72" fill="#c2854a"/>

  <!-- Ears -->
  <ellipse cx="185" cy="195" rx="22" ry="18" fill="#a0683a"/>
  <ellipse cx="327" cy="195" rx="22" ry="18" fill="#a0683a"/>
  <ellipse cx="185" cy="195" rx="13" ry="10" fill="#c2854a"/>
  <ellipse cx="327" cy="195" rx="13" ry="10" fill="#c2854a"/>

  <!-- Snout / nose -->
  <ellipse cx="256" cy="268" rx="38" ry="26" fill="#a0683a"/>
  <!-- Nostrils -->
  <ellipse cx="244" cy="268" rx="7" ry="5" fill="#6b4226"/>
  <ellipse cx="268" cy="268" rx="7" ry="5" fill="#6b4226"/>

  <!-- Eyes (simple cute circles) -->
  <circle cx="225" cy="230" r="12" fill="#2d1a0e"/>
  <circle cx="287" cy="230" r="12" fill="#2d1a0e"/>
  <circle cx="229" cy="226" r="4" fill="white"/>
  <circle cx="291" cy="226" r="4" fill="white"/>

  <!-- Legs -->
  <rect x="145" y="375" width="45" height="55" rx="20" fill="#a0683a"/>
  <rect x="205" y="375" width="45" height="55" rx="20" fill="#a0683a"/>
  <rect x="265" y="375" width="45" height="55" rx="20" fill="#a0683a"/>
  <rect x="325" y="375" width="45" height="55" rx="20" fill="#a0683a"/>

  <!-- Small tail -->
  <ellipse cx="380" cy="320" rx="16" ry="12" fill="#a0683a"/>

  <!-- Amber cursor blink on the forehead (AI glow accent) -->
  <rect x="248" y="175" width="5" height="28" rx="2.5" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Bottom terminal prompt decoration -->
  <rect x="36" y="455" width="440" height="26" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="52" y="473" font-family="'Consolas','Courier New',monospace" font-size="16" fill="#f59e0b">$</text>
  <text x="68" y="473" font-family="'Consolas','Courier New',monospace" font-size="16" fill="rgba(255,255,255,0.5)">claude --ide</text>
  <rect x="220" y="460" width="3" height="14" rx="1.5" fill="rgba(245,158,11,0.8)"/>
</svg>
